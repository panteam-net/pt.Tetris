name: iOS build and TestFlight

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version to upload to TestFlight (e.g. 1.0.0)'
        required: true
        default: '1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ format('{0}-{1}', github.workflow,
    github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

defaults:
  run:
    shell: bash
    working-directory: ios

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iPhone
            device: iPhone 17 Pro
          - platform: iPad
            device: iPad Pro 11-inch (M5)
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project and release preparation
        if: matrix.platform == 'iPhone'
        run: |
          python3 -B Scripts/validate_project.py
          python3 -B -m unittest discover -s Scripts/tests -v
          swift test --scratch-path "$RUNNER_TEMP/SwiftCoreBuild"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: >-
            ${{ format('spm-{0}-{1}-26.3-{2}', runner.os, runner.arch,
            hashFiles('ios/**/Package.resolved')) }}

      - name: Resolve pinned Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project pt.TetrisDuel.xcodeproj \
            -scheme pt.TetrisDuel \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build app and run unit and UI tests
        env:
          SIMULATOR_DEVICE: ${{ matrix.device }}
        run: |
          destination="platform=iOS Simulator,name=$SIMULATOR_DEVICE,OS=26.2"
          xcodebuild test \
            -project pt.TetrisDuel.xcodeproj \
            -scheme pt.TetrisDuel \
            -destination "$destination" \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Tests.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish to TestFlight
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: >-
            ${{ format('spm-{0}-{1}-26.3-{2}', runner.os, runner.arch,
            hashFiles('ios/**/Package.resolved')) }}

      - name: Sign, archive and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: >-
            ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: >-
            ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: >-
            ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: >-
            ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash Scripts/publish_testflight.sh

      - name: Save archive, IPA and upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight
          if-no-files-found: warn
          retention-days: 14
